<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İbrahim Kavasoğlu | FOH Engineer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{margin:0;font-family:Inter;background:#050505;color:#fff}
.container{width:90%;max-width:1100px;margin:auto}
section{padding:80px 0}
.hero{height:100vh;display:flex;align-items:center;position:relative}
.hero::before{
content:"";position:absolute;inset:0;
background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.4)),
url("images/gallery/0EAAE007-14C6-468D-80CB-6C5275CB6827.jpeg") center/cover;
z-index:-1;
}
h1{font-size:60px}
span{color:#ffb000}
.btn{background:#25D366;padding:12px 25px;border-radius:30px;color:#fff;text-decoration:none}
.gallery,.videos{display:grid;gap:15px;margin-top:30px}
.gallery{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gallery img{width:100%;height:200px;object-fit:cover;border-radius:10px;cursor:pointer}
.videos{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
video{width:100%;border-radius:10px}
form{display:flex;flex-direction:column;gap:10px;max-width:500px;margin:auto}
input,select,textarea{padding:10px;background:#111;border:1px solid #333;color:#fff}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
</style>

</head>

<body>

<section class="hero">
<div class="container">
<h1>İbrahim <span>Kavasoğlu</span></h1>
<p>FOH Engineer • Live Sound • Event Production</p>
<a href="#offer" class="btn">Teklif Al</a>
</div>
</section>

<section>
<div class="container">
<h2>Galeri</h2>
<div id="gallery" class="gallery"></div>
</div>
</section>

<section>
<div class="container">
<h2>Videolar</h2>
<div id="videos" class="videos"></div>
</div>
</section>

<section id="offer">
<div class="container">
<h2>Teklif Al</h2>

<form id="offerForm">

<input type="text" name="name" placeholder="Ad Soyad" required>
<input type="tel" name="phone" placeholder="Telefon" required>

<select name="type">
<option value="">Etkinlik Türü</option>
<option>Düğün</option>
<option>Konser</option>
<option>Festival</option>
</select>

<input type="number" name="people" placeholder="Kişi Sayısı">
<input type="date" name="date">

<textarea name="message" placeholder="Detay"></textarea>

<button class="btn">Gönder</button>

</form>

</div>
</section>

<a href="https://wa.me/905320683012" class="whatsapp">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script src="script.js"></script>

</body>
</html>
