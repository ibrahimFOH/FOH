<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İbrahim Kavasoğlu | FOH Engineer</title>

<meta name="description" content="FOH Sound Engineer | Konser, Festival, Live Music ve Event Production">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
font-family:'Inter',sans-serif;
background:#070707;
color:#fff;
margin:0;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

nav{
position:fixed;
width:100%;
background:#000;
padding:20px;
z-index:999;
}

.logo{
color:#ffb000;
font-weight:800;
}

.hero{
height:100vh;
display:flex;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.5)),
url("images/gallery/0EAAE007-14C6-468D-80CB-6C5275CB6827.jpeg")
center/cover no-repeat;
}

section{
padding:100px 0;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:12px;
cursor:pointer;
}

.videos video{
width:100%;
border-radius:12px;
}

.btn{
background:#25D366;
color:white;
padding:15px 25px;
border-radius:30px;
text-decoration:none;
display:inline-block;
}

</style>
</head>

<body id="top">

<nav>
<div class="container">
<span class="logo">EVENT TECHNOLOGIES</span>
</div>
</nav>

<section class="hero">
<div class="container">

<h1>
İbrahim <span style="color:#ffb000;">Kavasoğlu</span>
</h1>

<p>FOH Engineer</p>

<p style="color:#ffb000;">Event Technologies</p>

<a class="btn" href="#offer">Teklif Al</a>

</div>
</section>

<!-- GALERİ -->
<section id="gallery-section">
<div class="container">

<h2>Galeri</h2>

<div id="gallery" class="gallery"></div>

</div>
</section>

<!-- VİDEO -->
<section id="video">
<div class="container">

<h2>Videolar</h2>

<div id="videos" class="videos"></div>

</div>
</section>

<!-- TEKLİF -->
<section id="offer">
<div class="container">

<h2>Teklif</h2>

<form id="offerForm">

<input name="name" placeholder="Ad Soyad"><br><br>
<input name="phone" placeholder="Telefon"><br><br>
<input name="type" placeholder="Etkinlik"><br><br>
<input name="location" placeholder="Lokasyon"><br><br>
<input name="people" placeholder="Kişi Sayısı"><br><br>
<input name="date" type="date"><br><br>

<textarea name="message" placeholder="Mesaj"></textarea><br><br>

<button class="btn">Gönder</button>

</form>

</div>
</section>

<script src="script.js"></script>

</body>
</html>
