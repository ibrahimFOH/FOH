<label for="phone">Telefon</label>
<input id="phone" name="phone" type="tel" placeholder="Telefon" required>

<label for="service">Hizmet Türü</label>
<select id="service" name="service" required>
  <option value="" disabled selected>Hizmet Türü Seçin</option>
  <option>Ses Sistemi Kiralama</option>
  <option>Işık &amp; Truss Kiralama</option>
  <option>Stage Plot / Sahne Planı</option>
  <option>3D Sahne Çizimi</option>
  <option>SPL Hesaplama</option>
  <option>Teknik Rider Hazırlama</option>
  <option>FOH Operasyonu</option>
  <option>Paket (Kiralama + Mühendislik)</option>
  <option>Diğer</option>
</select>

<label for="location">Lokasyon / Şehir</label>
<input id="location" name="location" type="text" placeholder="Lokasyon / Şehir">

<label for="date">Etkinlik Tarihi</label>
<input id="date" name="date" type="date">

<label for="people">Tahmini Katılımcı Sayısı</label>
<input id="people" name="people" type="text" placeholder="Tahmini Katılımcı Sayısı">

<label for="message">Etkinlik detayları, özel istekler</label>
<textarea id="message" name="message" rows="5" placeholder="Etkinlik detayları, özel istekler..."></textarea>

<label style="display:block;margin:12px 0" for="kvkk_onay">
  <input type="checkbox" id="kvkk_onay" name="kvkk_onay" required>
  Kişisel verilerimin teklif hazırlanması amacıyla işlenmesini kabul ediyorum.
  <a href="Kvkk.html" target="_blank" rel="noopener">Aydınlatma Metni</a>
</label>

<button type="submit" class="btn btn-whatsapp" aria-label="Teklif Gönder">
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Teklif Al
</button>
